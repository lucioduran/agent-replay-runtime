[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-replay-runtime"
version = "0.1.0"
description = "A local event-sourced tool runtime with explicit crash reconciliation"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = []

[project.scripts]
agent-replay = "agent_replay.cli:main"

[tool.setuptools.packages.find]
include = ["agent_replay*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["agent_replay"]

[tool.coverage.run]
branch = true
source = ["agent_replay"]

[tool.coverage.report]
show_missing = true
fail_under = 90
